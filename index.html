<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm thử Tính cước Giỏ hàng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .instruction {
            padding: 15px;
            background-color: #f8f9fa;
            border-left: 5px solid #0056b3;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Bài tập: Thiết kế Thuật toán Điều phối & Ghép đôi</h1>
    <h2>Tính Cước Combo Khách hàng</h2>
    
    <div class="instruction">
        <strong>Hướng dẫn xem kết quả:</strong>
        <ol>
            <li>Nhấn phím <b>F12</b> (hoặc <b>Ctrl + Shift + I</b>) trên bàn phím.</li>
            <li>Chuyển sang tab <b>Console</b>.</li>
            <li>Bạn sẽ thấy kết quả tính toán đã được khắc phục lỗi ép kiểu hiển thị tại đây.</li>
        </ol>
    </div>

    <!-- Nhúng mã nguồn JavaScript -->
    <script src="calcCart.js"></script>

</html>
